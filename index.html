<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E5197F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rosa Modas">
<title>Rosa Modas · Controle</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap');

:root{
  --rosa:#E5197F;
  --rosa-esc:#C41169;
  --rosa-suave:#FDE8F1;
  --paper:#FFF7FA;
  --card:#FFFFFF;
  --ink:#2E1622;
  --muted:#96707F;
  --line:#F5DDE8;
  --folha:#4F8A54;
  --mimosa:#C98B08;
  --coral:#E8748A;
  --ui:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--ui);background:var(--paper);color:var(--ink);
  font-size:15px;line-height:1.45;padding-bottom:96px;overscroll-behavior-y:contain;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font-family:inherit;font-size:16px;color:inherit}

.tag-label{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- marca ---------- */
.head{position:sticky;top:0;z-index:40}
.brand{
  display:flex;align-items:center;gap:9px;
  background:var(--rosa);color:#fff;
  padding:calc(7px + env(safe-area-inset-top)) 16px 7px;
}
.brand img{width:20px;height:20px;border-radius:5px;flex:none}
.brand b{font-size:13px;font-weight:700;letter-spacing:.16em}
.brand em{margin-left:auto;font-style:normal;font-size:11px;opacity:.82;font-weight:500}
.top{background:var(--paper);padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.top h1{font-size:22px;font-weight:700;margin:2px 0 0;letter-spacing:-.02em}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top-num{text-align:right;flex:none}
.top-num b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

.wrap{padding:14px 16px 8px}
.garland{display:block;margin:0 auto 14px;max-width:100%;height:auto}

/* ---------- busca ---------- */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:0 12px;margin:14px 16px 12px}
.search input{border:0;outline:0;background:none;width:100%;padding:12px 0}
.search svg{flex:none;color:var(--rosa);opacity:.6}

/* ---------- etiqueta ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.tag{position:relative;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);
  clip-path:polygon(16px 0,100% 0,100% 100%,0 100%,0 16px);padding:14px 12px 12px;transition:transform .12s ease}
.tag:active{transform:scale(.975)}
.tag::before{content:'';position:absolute;left:7px;top:7px;width:7px;height:7px;border-radius:50%;
  border:1.5px solid var(--rosa);opacity:.55}
.tag.off{opacity:.42}
.tag-foto{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--rosa-suave);margin-bottom:10px}
.tag-nome{font-weight:600;font-size:14px;line-height:1.25;margin:0 0 2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag-meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-bottom:8px}
.tag-preco{font-size:19px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--rosa-esc)}
.tag-qtd{font-size:11px;font-weight:500;color:var(--muted);margin-top:2px}
.tag-qtd.low{color:var(--mimosa)}

.sw{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.14);display:inline-block}
.sw.lg{width:34px;height:34px}
.estampa{background:repeating-linear-gradient(45deg,#E8748A 0 4px,#F5E2C0 4px 8px,#8FB8DD 8px 12px)}

/* ---------- lista ---------- */
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.row:active{background:var(--rosa-suave)}
.row-img{width:48px;height:60px;object-fit:cover;border-radius:8px;flex:none;background:var(--rosa-suave)}
.row-ph{width:48px;height:60px;border-radius:8px;flex:none;background:var(--rosa-suave);
  display:flex;align-items:center;justify-content:center}
.row-mid{flex:1;min-width:0}
.row-mid b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-mid span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
.row-end{text-align:right;flex:none}
.row-end b{display:block;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--rosa-esc)}
.pill{display:inline-block;margin-top:3px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;
  background:var(--rosa-suave);color:var(--muted)}
.pill.low{background:#FBEEDC;color:var(--mimosa)}
.pill.zero{background:#F6E3E3;color:#A33B3B}

/* ---------- blocos ---------- */
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.box h3{font-size:14px;font-weight:600;margin:0 0 12px}
.stat{display:flex;align-items:baseline;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border:0;padding-bottom:0}
.stat b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none}
.folha{color:var(--folha)}.mimosa{color:var(--mimosa)}.rosa{color:var(--rosa)}

.bar-item{margin-bottom:11px}
.bar-item:last-child{margin-bottom:0}
.bar-top{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:5px}
.bar-top b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;flex:none}
.bar-track{height:9px;border-radius:999px;background:var(--rosa-suave);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--rosa)}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--rosa);border-color:var(--rosa);color:#fff}
.chip-sw{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:6px 12px 6px 7px;font-size:13px}
.chip-sw[aria-pressed="true"]{background:var(--rosa);border-color:var(--rosa);color:#fff}
.seg{display:flex;gap:6px;padding:14px 16px 12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg .chip{flex:none}

/* ---------- formulário ---------- */
.field{margin-bottom:16px}
.field > .tag-label{display:block;margin-bottom:7px}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 14px;outline:0}
.inp:focus-visible{border-color:var(--rosa);box-shadow:0 0 0 3px var(--rosa-suave)}
.money{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:0 14px}
.money span{color:var(--muted);font-size:13px;font-weight:600;margin-right:8px}
.money input{border:0;outline:0;background:none;width:100%;padding:13px 0;font-weight:600;font-size:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.step{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.step button{width:52px;height:50px;font-size:22px;font-weight:600;color:var(--rosa)}
.step button:active{background:var(--rosa-suave)}
.step input{flex:1;text-align:center;border:0;outline:0;background:none;font-size:19px;font-weight:700;
  font-variant-numeric:tabular-nums;min-width:0}
.hint{font-size:12px;color:var(--muted);margin-top:7px}
.hint b{color:var(--folha);font-weight:600}
.hint b.neg{color:#A33B3B}

/* ---------- fotos ---------- */
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.foto{position:relative;aspect-ratio:3/4;border-radius:11px;overflow:hidden;background:var(--rosa-suave)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto-x{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;
  background:rgba(46,22,34,.72);color:#fff;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center}
.foto-add{aspect-ratio:3/4;border:1.5px dashed var(--line);border-radius:11px;background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  color:var(--muted);font-size:11px;font-weight:600}
.foto-add:active{border-color:var(--rosa);color:var(--rosa)}
.foto-load{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.strip::-webkit-scrollbar{display:none}
.strip img{width:96px;height:128px;object-fit:cover;border-radius:11px;flex:none;background:var(--rosa-suave)}

/* ---------- botões ---------- */
.btn{display:block;width:100%;text-align:center;background:var(--rosa);color:#fff;border-radius:12px;
  padding:15px;font-size:16px;font-weight:600}
.btn:active{opacity:.85}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.zap{background:var(--card);color:var(--folha);border:1px solid #D9E9DC}
.btn.danger{background:var(--card);color:#A33B3B;border:1px solid #EBD5D5}
.btn:disabled{opacity:.4}
.btn + .btn{margin-top:9px}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;
  background:var(--rosa);color:#fff;border-radius:999px;padding:14px 20px;font-size:15px;font-weight:600;
  box-shadow:0 6px 20px rgba(229,25,127,.34);display:flex;align-items:center;gap:7px}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;font-weight:600;color:var(--muted)}
.nav button[aria-current="true"]{color:var(--rosa)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(46,22,34,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--paper);border-radius:20px 20px 0 0;
  max-height:92vh;overflow-y:auto;overscroll-behavior:contain;
  transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  padding:0 16px calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:9px auto 4px}
.sheet-head{position:sticky;top:0;background:var(--paper);padding:6px 0 14px;z-index:2}
.sheet-head h2{font-size:19px;font-weight:700;margin:0;letter-spacing:-.02em}
.sheet-head p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.total{display:flex;align-items:baseline;justify-content:space-between;background:var(--rosa-suave);
  border-radius:12px;padding:13px 15px;margin-bottom:14px}
.total b{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--rosa-esc)}

/* ---------- movimentos ---------- */
.mv{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.mv:last-child{border:0}
.mv-ic{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700}
.mv-in{background:#FBEEDC;color:var(--mimosa)}
.mv-out{background:#E4F0E8;color:var(--folha)}
.mv-mid{flex:1;min-width:0}
.mv-mid b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-mid span{font-size:11px;color:var(--muted)}
.mv-val{font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;flex:none}

.empty{text-align:center;padding:34px 24px}
.empty b{display:block;font-size:16px;font-weight:600;margin-bottom:5px}
.empty p{margin:0;font-size:14px;color:var(--muted);line-height:1.5}

.toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:90;
  background:var(--ink);color:#fff;border-radius:12px;padding:13px 16px;font-size:14px;font-weight:500;
  transform:translateY(140%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  display:flex;align-items:center;gap:12px}
.toast.on{transform:translateY(0)}
.toast button{margin-left:auto;font-weight:600;color:#F9A8CE;flex:none}

.lb{position:fixed;inset:0;background:rgba(30,12,20,.95);z-index:95;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:74vh;object-fit:contain;border-radius:10px}
.lb-nav{display:flex;align-items:center;gap:22px;color:#fff;font-size:14px}
.lb-nav button{color:#fff;font-size:26px;padding:4px 12px}

:focus-visible{outline:2px solid var(--rosa);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>

<div class="head">

</div>
<div id="view"></div>
<button class="fab" id="fab" onclick="abrirNova()">＋ Nova peça</button>
<nav class="nav" id="nav"></nav>
<div class="scrim" id="scrim" onclick="fecharSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="lb" id="lb"></div>
<input type="file" id="filepick" accept="image/*" multiple style="display:none">

const DB='rosamodas',ST='kv';
let _db=null;
function idb(){
  if(_db)return _db;
  _db=new Promise((ok,no)=>{
    const r=indexedDB.open(DB,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(ST);
    r.onsuccess=()=>ok(r.result);
    r.onerror=()=>no(r.error);
  });
  return _db;
}
function idbOp(modo,fn){
  return idb().then(d=>new Promise((ok,no)=>{
    const tx=d.transaction(ST,modo),req=fn(tx.objectStore(ST));
    tx.oncomplete=()=>ok(req?req.result:undefined);
    tx.onerror=()=>no(tx.error);
  }));
}
const MODO=(typeof window.storage!=='undefined'&&window.storage)?'claude'
  :(typeof indexedDB!=='undefined'?'local':'memoria');
const mem={};
const store={
  async get(k){
    try{
      if(MODO==='claude'){const r=await window.storage.get(k);return r&&r.value?r.value:null}
      if(MODO==='local'){const v=await idbOp('readonly',s=>s.get(k));return v===undefined?null:v}
    }catch(e){}
    return mem[k]!==undefined?mem[k]:null;
  },
  async set(k,v){
    mem[k]=v;
    try{
      if(MODO==='claude')return await window.storage.set(k,v);
      if(MODO==='local')return await idbOp('readwrite',s=>s.put(v,k));
    }catch(e){throw e}
  },
  async del(k){
    delete mem[k];
    try{
      if(MODO==='claude')return await window.storage.delete(k);
      if(MODO==='local')return await idbOp('readwrite',s=>s.delete(k));
    }catch(e){}
  }
};

async function carregar(){

}
async function salvar(){

async function lerFotos(id){

async function gravarFotos(id,arr){

  catch(e){toast('As fotos não couberam. Tente com menos fotos.')}
}

/* ============ imagens ============ */
function redim(src,max,q){
  return new Promise((ok,no)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      const s=Math.min(1,max/Math.max(w,h));
      w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      ok(c.toDataURL('image/jpeg',q));
    };
    img.onerror=()=>no(new Error('img'));
    img.src=src;
  });
}
const lerArquivo=f=>new Promise((ok,no)=>{
  const r=new FileReader();r.onload=e=>ok(e.target.result);r.onerror=()=>no(new Error('rd'));r.readAsDataURL(f);
});

/* ============ ornamento floral ============ */
function flor(x,y,r,c,mio){
  let s='';
  for(let i=0;i<5;i++){
    const a=i*72*Math.PI/180-Math.PI/2;
    const px=(x+Math.cos(a)*r*.55).toFixed(1),py=(y+Math.sin(a)*r*.55).toFixed(1);
    s+=`<ellipse cx="${px}" cy="${py}" rx="${(r*.42).toFixed(1)}" ry="${(r*.58).toFixed(1)}" fill="${c}"
      transform="rotate(${(a*180/Math.PI+90).toFixed(0)} ${px} ${py})"/>`;
  }
  return s+`<circle cx="${x}" cy="${y}" r="${(r*.3).toFixed(1)}" fill="${mio||'#F5C518'}"/>`;
}
function guirlanda(){
  const fl=[[26,26,10,'#E8748A'],[56,17,7,'#F5C518','#E08A00'],[86,27,9,'#F9A8CE'],[114,18,6,'#B08CD8'],
    [152,24,12,'#E8748A'],[190,17,7,'#F5C518','#E08A00'],[220,27,9,'#F9A8CE'],[250,18,6,'#E8748A'],
    [280,26,8,'#F5C518','#E08A00']];
  const fo=[[42,31,'#5B8F4E'],[102,13,'#4F8A54'],[170,32,'#5B8F4E'],[234,12,'#4F8A54'],[296,29,'#5B8F4E']];
  let s='';
  fo.forEach(([x,y,c],i)=>{s+=`<ellipse cx="${x}" cy="${y}" rx="13" ry="6" fill="${c}" opacity=".8"
    transform="rotate(${i%2?20:-20} ${x} ${y})"/>`});
  fl.forEach(a=>{s+=flor(a[0],a[1],a[2],a[3],a[4])});
  return `<svg class="garland" viewBox="0 0 320 46" width="320" height="46" aria-hidden="true">${s}</svg>`;
}

/* ============ cálculos ============ */
function desde(dias){const d=new Date();d.setHours(0,0,0,0);return d.getTime()-(dias-1)*864e5}
function movsPeriodo(dias){return dias<0?S.movimentos:S.movimentos.filter(m=>m.data>=desde(dias))}
const totaisHoje=()=>S.movimentos.filter(m=>m.tipo==='venda'&&m.data>=desde(1)).reduce((a,m)=>a+m.total,0);

/* ============ telas ============ */
function filtrados(){
  const q=busca.trim().toLowerCase();
  let l=S.produtos.slice();
  if(q)l=l.filter(p=>(p.nome+' '+p.cor+' '+p.tam+' '+(p.cat||'')).toLowerCase().includes(q));
  return l.sort((a,b)=>(b.qtd>0)-(a.qtd>0)||b.criado-a.criado);
}
function caixaBusca(ph){
  return `<div class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input placeholder="${ph}" value="${esc(busca)}" oninput="busca=this.value;atualizaLista()"></div>`;
}
function atualizaLista(){
  const el=$('lista');if(!el)return;
  el.outerHTML=aba==='vender'?listaVender():listaEstoque();
}
function vazio(t,p){return `<div class="empty">${guirlanda()}<b>${t}</b><p>${p}</p></div>`}

function telaVender(){

}

function telaEstoque(){

function telaRelatorios(){
  const segs=[[0,'Hoje'],[7,'7 dias'],[30,'30 dias'],[-1,'Tudo']];
  let h=`<div class="seg">${segs.map(([v,l])=>
    `<button class="chip" aria-pressed="${periodo===v}" onclick="periodo=${v};render()">${l}</button>`).join('')}</div>`;
  const ms=movsPeriodo(periodo===0?1:periodo);
  const vendas=ms.filter(m=>m.tipo==='venda'),entradas=ms.filter(m=>m.tipo==='entrada');
  const receb=vendas.reduce((a,m)=>a+m.total,0);
  const invest=entradas.reduce((a,m)=>a+m.total,0);
  const lucro=vendas.reduce((a,m)=>a+(m.preco-m.custo)*m.qtd,0);
  const pecas=vendas.reduce((a,m)=>a+m.qtd,0);
  const margem=receb>0?Math.round(lucro/receb*100):0;

  h+=`<div class="wrap"><div class="box"><span class="tag-label">Dinheiro</span>
    <div class="stat" style="padding-top:8px"><span>Entrou<small>${pecas} peça${pecas===1?'':'s'} vendida${pecas===1?'':'s'}</small></span><b class="folha">${brl(receb)}</b></div>
    <div class="stat"><span>Saiu<small>compra de peças no período</small></span><b class="mimosa">− ${brl(invest)}</b></div>
    <div class="stat"><span>Lucro das vendas<small>${margem}% de margem</small></span><b class="rosa">${brl(lucro)}</b></div>
  </div>`;
  h+=barras('Peças que mais saem',agrupa(vendas,m=>m.nome+' · '+m.tam),false);
  h+=barras('Cores que mais saem',agrupa(vendas,m=>m.cor),true);
  h+=barras('Categorias',agrupa(vendas.filter(m=>m.cat),m=>m.cat),false);

  const ult=ms.slice().sort((a,b)=>b.data-a.data).slice(0,25);
  h+=`<div class="box"><h3>Movimentações</h3>`+(ult.length?ult.map(m=>`<div class="mv">
      <div class="mv-ic ${m.tipo==='venda'?'mv-out':'mv-in'}">${m.tipo==='venda'?'↑':'↓'}</div>
      <div class="mv-mid"><b>${esc(m.nome)}</b><span>${m.qtd} un · ${esc(m.cor)} · ${data(m.data)}</span></div>
      <div class="mv-val ${m.tipo==='venda'?'folha':'mimosa'}">${m.tipo==='venda'?'+':'−'} ${brl(m.total)}</div>
    </div>`).join(''):`<p style="margin:0;font-size:13px;color:var(--muted)">Nenhuma movimentação nesse período.</p>`)+`</div>`;
  h+=`<button class="btn ghost" onclick="abrirAjustes()">Ajustes e backup</button></div>`;
  return h;
}
function agrupa(ms,fn){
  const m={};
  ms.forEach(x=>{const k=fn(x);if(!k)return;if(!m[k])m[k]={qtd:0};m[k].qtd+=x.qtd});
  return Object.entries(m).sort((a,b)=>b[1].qtd-a[1].qtd).slice(0,6);
}
function barras(titulo,itens,usarCor){
  if(!itens.length)return '';
  const max=itens[0][1].qtd;
  return `<div class="box"><h3>${titulo}</h3>${itens.map(([k,v])=>{
    const pct=Math.max(6,Math.round(v.qtd/max*100));
    const hex=usarCor?corHex(k):null;
    const fill=hex==='estampa'
      ?`class="bar-fill estampa" style="width:${pct}%"`
      :`class="bar-fill" style="background:${hex||'var(--rosa)'};width:${pct}%"`;
    return `<div class="bar-item"><div class="bar-top">${usarCor?swHTML(k):''}<span>${esc(k)}</span><b>${v.qtd}</b></div>
      <div class="bar-track"><div ${fill}></div></div></div>`;
  }).join('')}</div>`;
}
function data(t){
  const d=new Date(t),h=new Date();h.setHours(0,0,0,0);
  const hora=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  if(d.getTime()>=h.getTime())return 'hoje '+hora;
  if(d.getTime()>=h.getTime()-864e5)return 'ontem '+hora;
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+hora;
}

    <div class="two">
      <div class="field"><span class="tag-label">Custou (un)</span>
        <div class="money"><span>R$</span><input id="f-custo" inputmode="decimal" placeholder="0,00"

      <div class="field"><span class="tag-label">Vende por (un)</span>
        <div class="money"><span>R$</span><input id="f-preco" inputmode="decimal" placeholder="0,00"
          value="${esc(ficha.preco)}" oninput="ficha.preco=this.value;margem()"></div></div></div>
    <p class="hint" id="margem" style="margin-top:-6px;margin-bottom:16px"></p>

    ${edit?'':'<button class="btn ghost" onclick="salvarPeca(true)">Salvar e cadastrar outra</button>'}`);

function pick(k,v,cid){
  ficha[k]=ficha[k]===v?'':v;
  [...$(cid).children].forEach(b=>b.setAttribute('aria-pressed',b.textContent.trim()===ficha[k]));
}
function passo(d){ficha.qtd=Math.max(0,(ficha.qtd||0)+d);$('f-qtd').value=ficha.qtd}
function campo(id,padrao){
  const el=document.getElementById(id);
  return el && el.value!=='' ? el.value : (padrao==null?'':padrao);
}
function num(s){const v=parseFloat(String(s).replace(/\./g,'').replace(',','.'));return isNaN(v)?0:v}
function margem(){
  const el=$('margem');if(!el)return;
  const c=num(ficha.custo),p=num(ficha.preco);
  if(!p){el.innerHTML='';return}
  const l=p-c;
  el.innerHTML=`Lucro por peça: <b class="${l<0?'neg':''}">${brl(l)}</b> (${Math.round(l/p*100)}%)`;
}
function pintaFotos(){
  const g=$('grade-fotos');if(!g)return;
  g.innerHTML=fotosSheet.map((f,i)=>`<div class="foto"><img src="${f}" onclick="verFotos(${i})" alt="">
      <button class="foto-x" onclick="event.stopPropagation();tiraFoto(${i})">✕</button></div>`).join('')
    +(fotosSheet.length<3?`<button class="foto-add" onclick="pedirFoto()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
       stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2L8 5h8l1.5 2h2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-9Z"/><circle cx="12" cy="12.5" r="3.2"/></svg>
      Adicionar</button>`:'');
}
function tiraFoto(i){fotosSheet.splice(i,1);pintaFotos()}
function pedirFoto(){
  const inp=$('filepick');inp.value='';
  inp.onchange=async()=>{
    const fs=[...inp.files].slice(0,3-fotosSheet.length);
    if(!fs.length)return;
    const g=$('grade-fotos');
    if(g)g.insertAdjacentHTML('beforeend','<div class="foto foto-load">Carregando…</div>');
    for(const f of fs){
      try{fotosSheet.push(await redim(await lerArquivo(f),900,.72))}
      catch(e){toast('Não deu para ler essa imagem.')}
    }
    pintaFotos();
  };
  inp.click();
}
async function salvarPeca(outra){
  ficha.nome  = campo('f-nome', ficha.nome);
  ficha.custo = campo('f-custo', ficha.custo);
  ficha.preco = campo('f-preco', ficha.preco);
  ficha.qtd   = Math.max(0, parseInt(campo('f-qtd', ficha.qtd),10) || 0);
  if(!ficha.nome.trim())return toast('Dê um nome para a peça.');
  if(!num(ficha.preco))return toast('Informe por quanto ela vende.');
  const custo=num(ficha.custo),preco=num(ficha.preco),qtd=ficha.qtd;
  const capa=fotosSheet.length?await redim(fotosSheet[0],170,.6):null;
  if(ficha.id){
    const p=S.produtos.find(x=>x.id===ficha.id);
    const dif=qtd-p.qtd;
    Object.assign(p,{nome:ficha.nome.trim(),cor:ficha.cor||'Sem cor',tam:ficha.tam||'Único',
      cat:ficha.cat,custo,preco,qtd,capa,atualizado:Date.now()});
    if(dif>0)S.movimentos.push(mov('entrada',p,dif,custo,custo));
    await gravarFotos(p.id,fotosSheet);await salvar();fecharSheet();render();
    return toast('Peça atualizada.');
  }
  const p={id:uid('p'),nome:ficha.nome.trim(),cor:ficha.cor||'Sem cor',tam:ficha.tam||'Único',
    cat:ficha.cat,custo,preco,qtd,capa,criado:Date.now(),atualizado:Date.now()};
  S.produtos.push(p);
  if(qtd>0)S.movimentos.push(mov('entrada',p,qtd,custo,custo));
  await gravarFotos(p.id,fotosSheet);await salvar();render();
  toast(p.nome+' cadastrada.');
  if(outra){
    ficha={id:null,nome:'',cor:ficha.cor,tam:'',cat:ficha.cat,qtd:1,custo:ficha.custo,preco:''};
    fotosSheet=[];sheetForm(false);
  }else fecharSheet();
}
const mov=(tipo,p,qtd,preco,custo)=>({id:uid('m'),tipo,pid:p.id,nome:p.nome,cor:p.cor,tam:p.tam,cat:p.cat,
  qtd,preco,custo,total:preco*qtd,data:Date.now()});

/* ============ venda ============ */
function abrirVenda(id){
  const p=S.produtos.find(x=>x.id===id);if(!p)return;
  if(p.qtd<1)return abrirPeca(id);
  fotosSheet=[];lbFotos=[];
  venda={id,qtd:1,preco:String(p.preco).replace('.',',')};
  abrirSheet(cab('Registrar venda',`${esc(p.nome)} · ${esc(p.cor)} · ${esc(p.tam)}`)+`
    ${p.capa?`<div class="strip" id="strip"><img src="${p.capa}" alt=""></div>`:''}
    <div class="field"><span class="tag-label">Quantidade · ${p.qtd} no estoque</span>
      <div class="step"><button onclick="vQtd(-1)">−</button>
        <input id="v-qtd" inputmode="numeric" value="1" oninput="venda.qtd=Math.max(1,parseInt(this.value||1));vTotal()">
        <button onclick="vQtd(1)">＋</button></div></div>
    <div class="field"><span class="tag-label">Preço cobrado (un)</span>
      <div class="money"><span>R$</span><input id="v-preco" inputmode="decimal" value="${esc(venda.preco)}"
        oninput="venda.preco=this.value;vTotal()"></div>
      <p class="hint">Mudou por desconto? É só ajustar aqui.</p></div>
    <div class="total"><span class="tag-label">Total</span><b id="v-total">${brl(p.preco)}</b></div>
    <button class="btn" onclick="confirmarVenda()">Registrar venda</button>
    <button class="btn ghost" onclick="abrirPeca('${id}')">Ver a peça</button>`);
  if(p.capa)carregarStrip(id);
}
function vQtd(d){
  const p=S.produtos.find(x=>x.id===venda.id);
  venda.qtd=Math.min(p.qtd,Math.max(1,venda.qtd+d));$('v-qtd').value=venda.qtd;vTotal();
}
function vTotal(){$('v-total').textContent=brl(num(venda.preco)*venda.qtd)}
async function confirmarVenda(){
  const p=S.produtos.find(x=>x.id===venda.id);
  venda.preco = campo('v-preco', venda.preco);
  venda.qtd   = Math.max(1, parseInt(campo('v-qtd', venda.qtd),10) || 1);
  const preco=num(venda.preco),qtd=Math.min(p.qtd,venda.qtd);
  if(!qtd)return toast('Sem estoque dessa peça.');
  p.qtd-=qtd;p.atualizado=Date.now();
  const m=mov('venda',p,qtd,preco,p.custo);
  S.movimentos.push(m);await salvar();fecharSheet();render();
  toast('Venda de '+brl(preco*qtd)+' registrada.',()=>desfazer(m.id));
}
async function desfazer(mid){
  const i=S.movimentos.findIndex(m=>m.id===mid);if(i<0)return;
  const m=S.movimentos[i],p=S.produtos.find(x=>x.id===m.pid);
  if(p)p.qtd+=m.tipo==='venda'?m.qtd:-m.qtd;
  S.movimentos.splice(i,1);await salvar();render();toast('Desfeito.');
}

/* ============ ficha ============ */
async function abrirPeca(id){
  const p=S.produtos.find(x=>x.id===id);if(!p)return;
  fotosSheet=[];lbFotos=[];
  const vend=S.movimentos.filter(m=>m.tipo==='venda'&&m.pid===id).reduce((a,m)=>a+m.qtd,0);
  abrirSheet(cab(esc(p.nome),`${esc(p.cor)} · ${esc(p.tam)}${p.cat?' · '+esc(p.cat):''}`)+`
    <div class="strip" id="strip">${p.capa?`<img src="${p.capa}" alt="">`:''}</div>
    <div class="box">
      <div class="stat" style="padding-top:0"><span>Em estoque</span><b>${p.qtd} un</b></div>
      <div class="stat"><span>Já vendidas</span><b>${vend} un</b></div>
      <div class="stat"><span>Custou<small>por peça</small></span><b class="mimosa">${brl(p.custo)}</b></div>
      <div class="stat"><span>Vende por<small>lucro de ${brl(p.preco-p.custo)}</small></span><b class="folha">${brl(p.preco)}</b></div></div>
    ${p.qtd>0?`<button class="btn" onclick="abrirVenda('${id}')">Registrar venda</button>`:''}
    <button class="btn zap" onclick="mandarZap('${id}')">Mandar no WhatsApp</button>
    <button class="btn ghost" onclick="abrirReposicao('${id}')">Repor estoque</button>
    <button class="btn ghost" onclick="abrirEdicao('${id}')">Editar peça</button>
    <button class="btn danger" onclick="excluir('${id}')">Excluir peça</button>`);
  carregarStrip(id);
}
async function carregarStrip(id){
  const fs=await lerFotos(id),el=$('strip');
  if(!el)return;
  if(!fs.length){el.style.display='none';return}
  lbFotos=fs;
  el.innerHTML=fs.map((f,i)=>`<img src="${f}" onclick="verFotos(${i})" alt="">`).join('');
}
function mandarZap(id){
  const p=S.produtos.find(x=>x.id===id);
  const t=`${p.nome}\n${p.cor} · Tam ${p.tam}\n${brl(p.preco)}\n\nRosa Modas · @rosamodas59`;
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
}
function abrirReposicao(id){
  const p=S.produtos.find(x=>x.id===id);
  ficha={id,qtd:1,custo:String(p.custo).replace('.',',')};
  abrirSheet(cab('Repor estoque',`${esc(p.nome)} · ${esc(p.cor)} · ${esc(p.tam)}`)+`
    <div class="field"><span class="tag-label">Quantas peças chegaram</span>
      <div class="step"><button onclick="passo(-1)">−</button>
        <input id="f-qtd" inputmode="numeric" value="1" oninput="ficha.qtd=Math.max(1,parseInt(this.value||1))">
        <button onclick="passo(1)">＋</button></div></div>
    <div class="field"><span class="tag-label">Custo por peça</span>
      <div class="money"><span>R$</span><input id="r-custo" inputmode="decimal" value="${esc(ficha.custo)}"
        oninput="ficha.custo=this.value"></div></div>
    <button class="btn" onclick="confirmarReposicao()">Adicionar ao estoque</button>`);
}
async function confirmarReposicao(){
  const p=S.produtos.find(x=>x.id===ficha.id);
  const q=Math.max(1, parseInt(campo('f-qtd', ficha.qtd),10) || 1);
  const c=num(campo('r-custo', ficha.custo));
  p.qtd+=q;p.custo=c||p.custo;p.atualizado=Date.now();
  const m=mov('entrada',p,q,c,c);
  S.movimentos.push(m);await salvar();fecharSheet();render();
  toast('+'+q+' no estoque.',()=>desfazer(m.id));
}
async function excluir(id){
  const p=S.produtos.find(x=>x.id===id);
  if(!confirm(`Excluir "${p.nome}"? O histórico de vendas continua nos relatórios.`))return;
  S.produtos=S.produtos.filter(x=>x.id!==id);
  await gravarFotos(id,[]);await salvar();fecharSheet();render();toast('Peça excluída.');
}

/* ============ ajustes ============ */
function abrirAjustes(){
  const onde={claude:'na pré-visualização do Claude',local:'neste navegador, automaticamente',
    memoria:'só nesta sessão (este navegador não permite salvar)'}[MODO];
  abrirSheet(cab('Ajustes','Cada venda e cadastro é salvo na hora, sem precisar de botão.')+`
    <div class="box">
      <div class="stat" style="padding-top:0"><span>Peças cadastradas</span><b>${S.produtos.length}</b></div>
      <div class="stat"><span>Movimentações</span><b>${S.movimentos.length}</b></div>
      <div class="stat"><span>Onde fica salvo<small>${onde}</small></span><b></b></div></div>
    <button class="btn ghost" onclick="exportar()">Baixar backup (.json)</button>
    <button class="btn danger" onclick="apagarTudo()">Apagar todos os dados</button>
    ${guirlanda()}`);
}
function exportar(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='backup-rosamodas-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
async function apagarTudo(){
  if(!confirm('Apagar todas as peças e o histórico? Isso não tem volta.'))return;
  for(const p of S.produtos)await gravarFotos(p.id,[]);
  S={produtos:[],movimentos:[]};
  await salvar();fecharSheet();render();toast('Tudo apagado.');
}

/* ============ visualizador ============ */
function verFotos(i){
  if(fotosSheet.length)lbFotos=fotosSheet;
  if(!lbFotos.length)return;
  lbIdx=i;pintaLb();$('lb').classList.add('on');
}
function pintaLb(){
  $('lb').innerHTML=`<img src="${lbFotos[lbIdx]}" alt="">
    <div class="lb-nav">
      <button onclick="lbGo(-1)" ${lbFotos.length<2?'style="visibility:hidden"':''}>‹</button>
      <span>${lbIdx+1} de ${lbFotos.length}</span>
      <button onclick="lbGo(1)" ${lbFotos.length<2?'style="visibility:hidden"':''}>›</button></div>
    <button class="btn ghost" style="max-width:200px" onclick="document.getElementById('lb').classList.remove('on')">Fechar</button>`;
}
function lbGo(d){lbIdx=(lbIdx+d+lbFotos.length)%lbFotos.length;pintaLb()}

function toast(msg,undo){
  clearTimeout(undoTimer);
  $('toast').innerHTML=`<span>${esc(msg)}</span>${undo?'<button id="tundo">Desfazer</button>':''}`;
  if(undo)$('tundo').onclick=()=>{$('toast').classList.remove('on');undo()};
  $('toast').classList.add('on');
  undoTimer=setTimeout(()=>$('toast').classList.remove('on'),undo?5200:2600);
}

(async()=>{
  await carregar();render();
  if(MODO==='memoria')toast('Este navegador não deixa salvar. Os dados somem ao fechar.');
})();
</script>
